name: validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
      - run: pip install -r requirements.txt
      - run: python -m compileall -q service worker training tools tests
      - run: pytest -q
      - name: Download model release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1 --pattern 'v1-model.tar.gz' --dir artifacts
      - name: Unpack model
        run: mkdir -p artifacts/model && tar -xzf artifacts/v1-model.tar.gz -C artifacts/model
      - name: Evaluate release model quality
        run: python tools/evaluate.py --model-dir artifacts/model
      - name: JSON quality gate
        run: python tools/score.py results/student_predictions.jsonl data/validation.jsonl --min-validity 95
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
