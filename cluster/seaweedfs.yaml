apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.74
          args: ["server", "-s3", "-dir=/data", "-volume.max=0"]
          ports:
            - {name: s3, containerPort: 8333}
          volumeMounts:
            - {name: store, mountPath: /data}
      volumes:
        - name: store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
