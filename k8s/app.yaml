apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: parser}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: parser}
    spec:
      containers:
        - name: parser
          image: cloud-command-parser:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: MODEL_URI, value: "s3://models/v1"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "96"}
            - {name: FAULT_INJECT, value: "0"}
            - {name: AWS_DEFAULT_REGION, value: "us-east-1"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: object-store, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: object-store, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /readyz, port: 8000}
            failureThreshold: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: parser
  namespace: app
spec:
  selector: {app: parser}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parser
                port: {number: 8000}
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: parser
                port: {number: 8000}
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: parser
                port: {number: 8000}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: app
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: parser}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
